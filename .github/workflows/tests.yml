name: Tests

on:
  push:
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
      - name: Syntax check
        run: find src public database tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run tests
        run: php tests/run.php
